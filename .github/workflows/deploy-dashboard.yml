name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - "batches/**/manifest.json"
      - "dashboard/**"
      - "agents/ledger/**"
      - "schemas/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Regenerates dashboard/public/status.json from main's current
      # batch manifests, so the deployed dashboard reflects real state —
      # never a stale or hand-edited status file.
      - run: npm run ledger

      - run: npm ci
        working-directory: dashboard

      - run: npm run build
        working-directory: dashboard

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

      - id: deployment
        uses: actions/deploy-pages@v4
