name: Pipeline (weekly)

on:
  schedule:
    - cron: "0 13 * * 1" # Monday 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: process
        run: npm run process-queue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Refresh dashboard status
        run: npm run ledger

      - name: Open PR for human review
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Pipeline: research, prompts, images, interior, and listing for ${{ steps.process.outputs.theme }}"
          branch: batch/${{ steps.process.outputs.batch_id }}
          title: "New batch: ${{ steps.process.outputs.theme }}"
          labels: automated-batch
          body: |
            Scout proposed and selected this theme itself via the Anthropic API (blended with anything queued by hand in `theme-queue.json`) and researched it, Loom generated prompts (including a cover prompt with the title baked in), Etch generated the interior images and the front-cover art via the Gemini API, and Bindery + Crier assembled the interior PDF and listing copy — the whole pipeline ran unattended, per CLAUDE.md's Authorized external APIs section.

            This PR does not publish anything. A human should read `batches/${{ steps.process.outputs.batch_id }}/research.md`, proof `interior.pdf`, `cover-art.png`, and `listing.json`, then either:
            - merge this PR and publish externally (disclosing the AI-generated content per KDP's requirements), or
            - close this PR to discard the batch, or
            - replace files in the batch's `images/` folder and push — that retriggers `bindery-crier.yml` to reassemble with the new images.
