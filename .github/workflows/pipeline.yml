name: Pipeline (weekly)

on:
  schedule:
    - cron: "0 13 * * 1" # Monday 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: process
        run: npm run process-queue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Refresh dashboard status
        run: npm run ledger

      - name: Open PR for human review
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Pipeline: ${{ steps.process.outputs.content_type }} batch for ${{ steps.process.outputs.theme }} (${{ steps.process.outputs.category }})"
          branch: batch/${{ steps.process.outputs.batch_id }}
          title: "New batch: ${{ steps.process.outputs.theme }} (${{ steps.process.outputs.category }})"
          labels: automated-batch
          body: ${{ steps.process.outputs.pr_body }}
