name: Scout + Loom (weekly)

on:
  schedule:
    - cron: "0 13 * * 1" # Monday 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  research-next-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: process
        run: npm run process-queue

      - name: Open PR for human review
        if: steps.process.outputs.batch_id != ''
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Scout+Loom: research and prompts for ${{ steps.process.outputs.theme }}"
          branch: batch/${{ steps.process.outputs.batch_id }}
          title: "New batch: ${{ steps.process.outputs.theme }}"
          labels: automated-batch
          body: |
            Scout researched this theme from `theme-queue.json` and Loom generated its prompt batch — both automatically, since queuing the theme is the human approval this pipeline requires before Loom runs.

            This PR does not publish anything. A human should read `batches/${{ steps.process.outputs.batch_id }}/research.md`, then either:
            - merge this PR and generate images for `prompts.json` externally, dropping them into the batch's `images/` folder (which triggers Bindery + Crier automatically), or
            - close this PR to discard the theme.
